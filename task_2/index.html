<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <title>Task 2</title>
  </head>
  <body>
    <section class="cta">
      <div class="container">
        <div class="cta__content">
          <h2 class="cta__title">
            Be the first to know about new drops and exclusive offers!
          </h2>
          <p class="cta__text">
            Subscribe to our newsletter for early access, special deals, and the
            latest trends.
          </p>
        </div>
        <form class="cta__subscribe">
          <input
            id="email"
            class="cta__subscribe-input"
            type="email"
            placeholder="Your Email"
            autocomplete="email"
          />
          <button class="cta__subscribe-button">
            SIGN UP
            <img
              class="cta__subscribe-icon"
              src="./img/arrow-icon.svg"
              alt="arrow icon"
            />
          </button>
        </form>
      </div>
    </section>
  </body>
</html>
