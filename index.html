<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Adaptive layout</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="promo">
        <div class="promo__inner">
          <div class="promo__content">
            <h2 class="promo__title">elevate your wardrobe</h2>
            <p class="promo__text">
              Don't miss out – experience the epitome of fashion by clicking
              'Buy Now' and embrace a world of chic elegance delivered to your
              doorstep. Your style journey begins here.
            </p>
          </div>
          <a class="promo__link" href="#">
            <p class="promo__link-text">Shop Now</p>
            <img
              class="promo__link-icon"
              src="./img/arrow-icon.svg"
              alt="promo link icon"
            />
          </a>
          <div class="promo__img-wrapper">
            <img class="promo__img" src="./img/bg-icon.svg" alt="bg icon" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
